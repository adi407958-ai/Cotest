<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VDS Tarayıcı</title>
<style>
:root{color-scheme:dark;--bg:#202124;--bar:#292a2d;--line:#3c4043;--text:#e8eaed;--muted:#9aa0a6;--blue:#8ab4f8}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}.chrome{height:100dvh;display:flex;flex-direction:column}.tabs{height:42px;display:flex;align-items:end;padding:0 8px;background:#171717;gap:4px}.tab{height:36px;max-width:240px;min-width:150px;padding:0 12px;display:flex;align-items:center;gap:8px;background:var(--bar);border-radius:10px 10px 0 0;color:var(--text)}.tab.active{background:#35363a}.tab .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab .close{font-size:18px;color:var(--muted)}.newtab{font-size:25px;padding:0 10px;height:36px;color:var(--muted)}.toolbar{height:52px;display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--line)}.nav{font-size:23px;width:36px;color:var(--muted)}.address{height:38px;display:flex;align-items:center;gap:8px;flex:1;border-radius:20px;background:#202124;padding:0 14px}.address input{width:100%;background:none;border:0;outline:0;color:var(--text)}.go{color:var(--blue);font-weight:600}.status{height:24px;padding:4px 12px;color:var(--muted);font-size:12px;white-space:nowrap}.stage{position:relative;flex:1;display:flex;justify-content:center;align-items:center;background:#101112;overflow:hidden;touch-action:none}.screen{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:block;background:#fff}.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#aeb4bd;background:#202124dd;padding:14px 18px;border-radius:12px;text-align:center}.hidden{display:none!important}@media(max-width:600px){.tabs{height:38px}.tab{min-width:115px;height:32px;padding:0 8px}.toolbar{height:48px;padding:4px}.nav{width:30px;font-size:19px}.address{height:36px}.status{font-size:11px;padding:3px 8px}}
</style>
</head>
<body>
<div class="chrome">
  <div class="tabs" id="tabs"><button class="newtab" id="newTab" title="Yeni sekme">+</button></div>
  <div class="toolbar">
    <button class="nav" id="back" title="Geri">‹</button><button class="nav" id="forward" title="İleri">›</button><button class="nav" id="reload" title="Yenile">↻</button>
    <form class="address" id="addressForm"><span>🔒</span><input id="address" autocomplete="off" placeholder="Film, site veya arama yazın…"><button class="go" type="submit">Git</button></form>
  </div>
  <div class="status" id="status">VDS tarayıcı bağlanıyor…</div>
  <div class="stage" id="stage"><img class="screen" id="screen" alt="VDS Chrome ekranı"><div class="hint" id="hint">VDS Chrome hazırlanıyor…</div></div>
</div>
<script>
const q=new URLSearchParams(location.search), token=q.get('token')||'';
const wsUrl=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+encodeURIComponent(token);
const ws=new WebSocket(wsUrl), screen=document.querySelector('#screen'), stage=document.querySelector('#stage'), hint=document.querySelector('#hint'), statusEl=document.querySelector('#status'), tabsEl=document.querySelector('#tabs'), address=document.querySelector('#address');
let tabs=[], currentId=null, dragging=false, lastPoint=null;
function send(x){if(ws.readyState===1)ws.send(JSON.stringify(x))}
function status(x){statusEl.textContent=x}
function drawTabs(){tabsEl.querySelectorAll('.tab').forEach(x=>x.remove());tabs.forEach(t=>{const b=document.createElement('button');b.className='tab '+(t.id===currentId?'active':'');b.innerHTML='<span>🌐</span><span class="title"></span><span class="close">×</span>';b.querySelector('.title').textContent=t.title||'Yeni sekme';b.onclick=()=>send({type:'switchTab',id:t.id});tabsEl.insertBefore(b,document.querySelector('#newTab'))})}
ws.onopen=()=>status('Bağlandı · VDS Chrome aktif');ws.onclose=()=>{status('Bağlantı kesildi');hint.textContent='VDS bağlantısı kesildi';hint.classList.remove('hidden')};ws.onerror=()=>status('Bağlantı hatası');
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ready'||m.type==='tabs'){tabs=m.tabs||tabs;currentId=m.targetId||currentId;drawTabs();hint.classList.add('hidden');status('VDS Chrome aktif')}if(m.type==='frame'){screen.src='data:image/jpeg;base64,'+m.image;hint.classList.add('hidden')}if(m.type==='meta'){if(m.url&&document.activeElement!==address)address.value=m.url;const active=tabs.find(t=>t.id===currentId);if(active)active.title=m.title||active.title;drawTabs()}if(m.type==='error')status('Hata: '+m.error)};
document.querySelector('#newTab').onclick=()=>send({type:'newTab',url:'https://www.google.com'});
document.querySelector('#back').onclick=()=>send({type:'back'});document.querySelector('#forward').onclick=()=>send({type:'forward'});document.querySelector('#reload').onclick=()=>send({type:'reload'});
document.querySelector('#addressForm').onsubmit=e=>{e.preventDefault();send({type:'navigate',url:address.value})};
function point(e){const r=screen.getBoundingClientRect();return{x:Math.max(0,Math.min(1280,(e.clientX-r.left)*1280/r.width)),y:Math.max(0,Math.min(720,(e.clientY-r.top)*720/r.height))}}
stage.onpointerdown=e=>{if(e.target!==screen)return;dragging=true;stage.setPointerCapture(e.pointerId);lastPoint=point(e);send({type:'move',...lastPoint});send({type:'click',...lastPoint})};stage.onpointermove=e=>{if(!dragging)return;const p=point(e);send({type:'move',...p});lastPoint=p};stage.onpointerup=e=>{dragging=false;const p=point(e);send({type:'release',...p})};stage.onwheel=e=>{e.preventDefault();const p=point(e);send({type:'scroll',...p,deltaY:e.deltaY})};
document.addEventListener('keydown',e=>{if(document.activeElement===address)return;if(e.key==='Backspace'||e.key==='Enter'||e.key==='Escape'||e.key.startsWith('Arrow')){e.preventDefault();send({type:'key',key:e.key,code:e.code,down:true});send({type:'key',key:e.key,code:e.code,down:false})}});
screen.addEventListener('dblclick',e=>{const p=point(e);send({type:'click',...p});send({type:'release',...p})});
</script>
</body></html>
